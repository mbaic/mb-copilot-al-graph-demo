name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.2.0)'
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm install

      - name: Get version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            VERSION="${{ github.ref }}"
            VERSION="${VERSION#refs/tags/v}"
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

      - name: Update package.json version
        if: github.event_name == 'workflow_dispatch'
        run: |
          npm version ${{ steps.version.outputs.version }} --no-git-tag-version

      - name: Package extension
        run: npx vsce package --out mb-al-graph-demo-${{ steps.version.outputs.version }}.vsix

      - name: Generate release notes
        id: notes
        run: |
          {
            echo "release_body<<EOF"
            grep -A 50 "## ${{ steps.version.outputs.version }}" CHANGELOG.md | head -20 || echo "See CHANGELOG.md for details."
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Create release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          release_name: "MB AL Graph Demo ${{ steps.version.outputs.version }}"
          body: ${{ steps.notes.outputs.release_body }}
          draft: false
          prerelease: false

      - name: Upload extension to release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./mb-al-graph-demo-${{ steps.version.outputs.version }}.vsix
          asset_name: mb-al-graph-demo-${{ steps.version.outputs.version }}.vsix
          asset_content_type: application/zip
