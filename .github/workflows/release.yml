name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.2.0)'
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Get version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${INPUT_VERSION#v}"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid version '$VERSION' (expected semver like 0.2.0)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "vsix=mb-al-graph-demo-$VERSION.vsix" >> "$GITHUB_OUTPUT"

      # Stamp the release version into package.json so the VSIX manifest matches the tag.
      # --allow-same-version: package.json may already carry this version.
      - name: Set package.json version
        run: npm version "${{ steps.version.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Package extension
        run: npx vsce package --out "${{ steps.version.outputs.vsix }}"

      - name: Generate release notes
        run: |
          # Take the CHANGELOG section for this version (up to the next "## " heading).
          awk -v v="## ${{ steps.version.outputs.version }}" \
            'index($0, v) == 1 {f=1; next} /^## / && f {exit} f' CHANGELOG.md > release-notes.md
          if [[ ! -s release-notes.md ]]; then
            echo "See CHANGELOG.md for details." > release-notes.md
          fi
          cat release-notes.md

      - name: Create GitHub release with VSIX
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            "${{ steps.version.outputs.vsix }}" \
            --title "MB AL Graph Demo ${{ steps.version.outputs.version }}" \
            --notes-file release-notes.md \
            --target "$GITHUB_SHA"

      - name: Upload VSIX as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.vsix }}
          path: ${{ steps.version.outputs.vsix }}
